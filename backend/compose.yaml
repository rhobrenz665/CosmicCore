services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server's Linux image is x86-64 only. This requests Docker Desktop's
    # amd64 emulation on Apple Silicon; Microsoft does not support this setup.
    platform: linux/amd64
    container_name: cosmiccore-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in backend/.env}
    ports:
      - "1433:1433"
    volumes:
      - cosmiccore-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  cosmiccore-sqlserver-data:
